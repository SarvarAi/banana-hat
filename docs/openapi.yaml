components:
  schemas:
    Assignment:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        event:
          type: string
          readOnly: true
        judge:
          type: string
          readOnly: true
        project:
          allOf:
          - $ref: '#/components/schemas/Project'
          readOnly: true
        status:
          $ref: '#/components/schemas/AssignmentStatusEnum'
        source:
          $ref: '#/components/schemas/SourceEnum'
        scored:
          type: boolean
          readOnly: true
      required:
      - event
      - id
      - judge
      - project
      - scored
    AssignmentPlan:
      type: object
      properties:
        created:
          type: integer
        shortfalls:
          type: array
          items: {}
        seed:
          type: integer
      required:
      - created
      - seed
      - shortfalls
    AssignmentStatusEnum:
      enum:
      - pending
      - done
      - recused
      type: string
      description: |-
        * `pending` - To review
        * `done` - Reviewed
        * `recused` - Recused (conflict of interest)
    AuditEntry:
      type: object
      properties:
        id:
          type: integer
        at:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        summary:
          type: string
        target:
          type: array
          items:
            type: string
        data:
          type: object
          additionalProperties: {}
        digest:
          type: string
      required:
      - action
      - actor
      - at
      - data
      - digest
      - id
      - summary
      - target
    AuditPage:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        chain:
          $ref: '#/components/schemas/ChainReport'
      required:
      - chain
      - entries
    AutoAssignRequest:
      type: object
      properties:
        target:
          type: integer
          maximum: 20
          minimum: 1
        max_load:
          type: integer
          minimum: 1
        dry_run:
          type: boolean
          default: false
    Ballot:
      type: object
      properties:
        ballot:
          type: string
        votes_allowed:
          type: integer
        status:
          type: string
        projects:
          type: array
          items:
            $ref: '#/components/schemas/BallotProject'
          description: In this ballot's own random order.
      required:
      - ballot
      - projects
      - status
      - votes_allowed
    BallotCast:
      type: object
      properties:
        ballot:
          type: string
        status:
          type: string
      required:
      - ballot
      - status
    BallotProject:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        team:
          type: string
        chosen:
          type: boolean
      required:
      - chosen
      - id
      - team
      - title
    BallotWriteRequest:
      type: object
      properties:
        projects:
          type: array
          items:
            type: string
            minLength: 1
          maxItems: 50
          minItems: 1
      required:
      - projects
    ChainReport:
      type: object
      properties:
        ok:
          type: boolean
        checked:
          type: integer
        head:
          type: string
        broken_at:
          type: integer
          nullable: true
        reason:
          type: string
      required:
      - broken_at
      - checked
      - head
      - ok
      - reason
