openapi: 3.0.3
info:
  title: Banana Hat API
  version: 1.0.0
  description: 'Hackathon submission and judging. Authenticate with `Authorization:
    Bearer <token>`; create tokens on your account page.'
paths:
  /api/v1/assignments/{assignment_id}/recuse:
    post:
      operationId: assignments_recuse_create
      parameters:
      - in: path
        name: assignment_id
        schema:
          type: string
        required: true
      tags:
      - assignments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecuseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecuseRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
          description: ''
  /api/v1/assignments/{assignment_id}/score:
    get:
      operationId: assignments_score_retrieve
      description: PUT your score for an assignment. Replaces any earlier score until
        judging closes.
      parameters:
      - in: path
        name: assignment_id
        schema:
          type: string
        required: true
      tags:
      - assignments
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Score'
          description: ''
    put:
      operationId: assignments_score_update
      description: PUT your score for an assignment. Replaces any earlier score until
        judging closes.
      parameters:
      - in: path
        name: assignment_id
        schema:
          type: string
        required: true
      tags:
      - assignments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScoreWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScoreWriteRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Score'
          description: ''
  /api/v1/events:
    get:
      operationId: events_list
      description: Events you can see. POST creates one (requires permission to create
        events).
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - events
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'
          description: ''
    post:
      operationId: events_create
      description: Events you can see. POST creates one (requires permission to create
        events).
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/v1/events/{event_id}:
    get:
      operationId: events_retrieve
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      tags:
      - events
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
          description: ''
    patch:
      operationId: events_partial_update
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEventDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEventDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEventDetailRequest'
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
          description: ''
  /api/v1/events/{event_id}/assignments/auto:
    post:
      operationId: events_assignments_auto_create
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoAssignRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AutoAssignRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AutoAssignRequest'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentPlan'
          description: ''
  /api/v1/events/{event_id}/audit:
    get:
      operationId: events_audit_retrieve
      description: The event's audit trail, newest first. ?before=<entry id> pages
        backwards.
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: before
        schema:
          type: integer
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      tags:
      - events
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
          description: ''
  /api/v1/events/{event_id}/ballot:
    get:
      operationId: events_ballot_retrieve
      description: Signed-in voting. GET shows your ballot in its own random order.
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      tags:
      - events
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ballot'
          description: ''
    post:
      operationId: events_ballot_create
      description: Signed-in voting. GET shows your ballot in its own random order.
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BallotWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BallotWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BallotWriteRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BallotCast'
          description: ''
  /api/v1/events/{event_id}/criteria:
    get:
      operationId: events_criteria_list
      description: Read the rubric, or replace it (organizers, before any score exists).
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      tags:
      - events
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Criterion'
          description: ''
    put:
      operationId: events_criteria_update
      description: Read the rubric, or replace it (organizers, before any score exists).
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CriterionRequest'
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CriterionRequest'
          multipart/form-data:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CriterionRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Criterion'
          description: ''
  /api/v1/events/{event_id}/exports/{kind}:
    get:
      operationId: events_exports_retrieve
      description: |-
        CSV and JSON exports. Organizers only.

        - scores.csv    one row per review: judge, project, every criterion, weighted total
        - results.csv   the ranking under the event's normalization method, with raw means
        - projects.csv  every project, including drafts and flagged duplicates
        - event.json    the whole event in DOGFOOD fixture format (re-importable)
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      - in: path
        name: kind
        schema:
          type: string
          pattern: ^scores\.csv|results\.csv|projects\.csv|event\.json$
        required: true
      tags:
      - events
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/events/{event_id}/judges/invitations:
    post:
      operationId: events_judges_invitations_create
      description: |-
        Bulk judge invitations from a roster: one `email,name,tracks` line per judge,
        tracks separated by `;`. All lines are validated first; any problem invites nobody.
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JudgeRosterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JudgeRosterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JudgeRosterRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JudgeRosterResult'
          description: ''
  /api/v1/events/{event_id}/my-team:
    get:
      operationId: events_my_team_retrieve
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      tags:
      - events
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
  /api/v1/events/{event_id}/pairwise:
    get:
      operationId: events_pairwise_retrieve
      description: 'Pairwise mode: the next pair of projects for you to compare.'
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      tags:
      - events
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairwisePair'
          description: ''
    post:
      operationId: events_pairwise_create
      description: 'Pairwise mode: the next pair of projects for you to compare.'
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairwiseWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PairwiseWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PairwiseWriteRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          description: No response body
  /api/v1/events/{event_id}/progress:
    get:
      operationId: events_progress_retrieve
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      tags:
      - events
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progress'
          description: ''
  /api/v1/events/{event_id}/projects:
    get:
      operationId: events_projects_list
      description: |-
        GET: the event's gallery. POST: create your team's project in this event.

        POST is refused with 403 `submissions_closed` once the deadline has passed. The
        deadline is checked before anything else about the request.
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      tags:
      - events
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
          description: ''
    post:
      operationId: events_projects_create
      description: |-
        GET: the event's gallery. POST: create your team's project in this event.

        POST is refused with 403 `submissions_closed` once the deadline has passed. The
        deadline is checked before anything else about the request.
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectWriteRequest'
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/v1/events/{event_id}/publish:
    post:
      operationId: events_publish_create
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublishRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Published'
          description: ''
  /api/v1/events/{event_id}/results:
    get:
      operationId: events_results_retrieve
      description: Published results. Organizers may preview live results with ?preview=1&method=.
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      - in: query
        name: method
        schema:
          type: string
      - in: query
        name: preview
        schema:
          type: boolean
      tags:
      - events
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Results'
          description: ''
  /api/v1/events/{event_id}/roles:
    get:
      operationId: events_roles_list
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      tags:
      - events
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
          description: ''
  /api/v1/events/{event_id}/scores:
    get:
      operationId: events_scores_list
      description: Every score in the event. Organizers only.
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      tags:
      - events
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Score'
          description: ''
  /api/v1/events/{event_id}/teams:
    post:
      operationId: events_teams_create
      description: POST creates a team in the event with you as captain.
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
  /api/v1/events/{event_id}/votes:
    get:
      operationId: events_votes_retrieve
      description: Community vote totals. 403 `results_hidden` for everyone until
        voting closes.
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      tags:
      - events
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Votes'
          description: ''
  /api/v1/events/{event_id}/webhooks:
    get:
      operationId: events_webhooks_list
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      tags:
      - events
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
          description: ''
    post:
      operationId: events_webhooks_create
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
          description: ''
  /api/v1/events/import:
    post:
      operationId: events_import_create
      description: Create an event from a DOGFOOD fixture-format document.
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/judges/{judge_id}/record:
    get:
      operationId: judges_record_retrieve
      description: |-
        A judge's signed participation record.

        GET: the latest record, for the judge themselves or an organizer of their event.
        POST: issue a fresh one now (organizers). Records are also issued automatically to
        every judge when results are published.
      parameters:
      - in: path
        name: judge_id
        schema:
          type: string
        required: true
      tags:
      - judges
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedRecord'
          description: ''
    post:
      operationId: judges_record_create
      description: |-
        A judge's signed participation record.

        GET: the latest record, for the judge themselves or an organizer of their event.
        POST: issue a fresh one now (organizers). Records are also issued automatically to
        every judge when results are published.
      parameters:
      - in: path
        name: judge_id
        schema:
          type: string
        required: true
      tags:
      - judges
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedRecord'
          description: ''
  /api/v1/judges/{judge_id}/scores:
    get:
      operationId: judges_scores_list
      description: |-
        Scores written by one judge.

        `me` means you. Any other judge id is readable only by that judge themselves or by
        an organizer of the judge's event; everyone else gets 403. A `?judge=` query
        parameter naming someone else is refused the same way rather than ignored.
      parameters:
      - in: query
        name: event
        schema:
          type: string
        description: Only this event's scores.
      - in: path
        name: judge_id
        schema:
          type: string
        required: true
      tags:
      - judges
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Score'
          description: ''
  /api/v1/judges/me/assignments:
    get:
      operationId: judges_me_assignments_list
      description: Your review queue across events.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - judges
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssignmentList'
          description: ''
  /api/v1/me:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/projects:
    get:
      operationId: projects_list
      description: The public gallery. Filter with ?event=evt_01&track=trk_01&q=text.
      parameters:
      - in: query
        name: event
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: q
        schema:
